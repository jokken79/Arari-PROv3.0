codecov:
  branch: main
  require_ci_to_pass: true
  max_report_age: 24

coverage:
  precision: 2
  round: down
  range:
    - 70
    - 100
  status:
    project:
      default:
        target: 70
        threshold: 5%
        base: auto
        if_not_found: success
        if_ci_failed: failure
    patch:
      default:
        target: 70
        threshold: 5%
        if_not_found: success
        if_ci_failed: failure
    changes:
      default:
        target: 80
        threshold: 5%
        if_not_found: success
        if_ci_failed: failure

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
  require_base: true
  require_head: true
  delete: false

flags:
  backend:
    paths:
      - arari-app/api
    carryforward: true
  frontend:
    paths:
      - arari-app/src
    carryforward: true

ignore:
  - "*.md"
  - "*.json"
  - ".github"
  - "docs"
