name: Arari PRO CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Cache Python dependencies
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('arari-app/api/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    # Cache npm dependencies
    - name: Cache npm dependencies
      uses: actions/cache@v4
      with:
        path: arari-app/node_modules
        key: ${{ runner.os }}-npm-${{ hashFiles('arari-app/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '18'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r arari-app/api/requirements.txt
        pip install pytest-cov

    - name: Clear npm cache and install dependencies
      run: |
        npm cache clean --force
        cd arari-app
        npm install --legacy-peer-deps

    # Run Python tests with coverage
    - name: Run Python tests with coverage
      run: |
        cd arari-app/api
        python -m pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing

    # Run Frontend tests
    - name: Run Frontend tests
      run: |
        cd arari-app
        npm test

    # Python linter
    - name: Run Python linter
      run: |
        cd arari-app
        python -m ruff check api

    # Frontend linter
    - name: Run Frontend linter
      run: |
        cd arari-app
        npm run lint

    # Build verification - ensure production build works
    - name: Build Frontend (Production)
      run: |
        cd arari-app
        npm run build

    # Upload backend coverage to Codecov
    - name: Upload Backend Coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./arari-app/api/coverage.xml
        flags: backend
        name: backend-coverage
        fail_ci_if_error: false
      continue-on-error: true

    # Frontend coverage reporting
    - name: Report Frontend Test Coverage
      run: |
        cd arari-app
        npm test -- --coverage --watchAll=false --passWithNoTests || true
      continue-on-error: true

  security:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install security tools
      run: |
        pip install safety bandit

    # Scan Python dependencies for vulnerabilities
    - name: Check Python dependencies (Safety)
      run: |
        pip install -r arari-app/api/requirements.txt
        safety check --json --output safety-report.json || true
      continue-on-error: true

    # Static Analysis Security Testing (Python)
    - name: SAST Python (Bandit)
      run: |
        bandit -r arari-app/api -f json -o bandit-report.json -ll || true
      continue-on-error: true

    # Scan Node dependencies for vulnerabilities
    - name: Check Node dependencies (npm audit)
      run: |
        cd arari-app
        npm audit --audit-level=moderate --json > npm-audit.json || true
      continue-on-error: true

    # Upload security reports as artifacts
    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          safety-report.json
          bandit-report.json
          arari-app/npm-audit.json
        retention-days: 30

  # E2E Tests (runs after build completes)
  e2e:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '18'

    - name: Install dependencies
      run: |
        cd arari-app
        npm ci

    - name: Install Playwright browsers
      run: |
        cd arari-app
        npx playwright install --with-deps

    # E2E Tests with Playwright
    - name: Run E2E Tests (Playwright)
      run: |
        cd arari-app
        npm run test:e2e || true
      continue-on-error: true
      timeout-minutes: 20

    # Upload E2E test results
    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: arari-app/playwright-report/
        retention-days: 30

  # Branch protection check
  status-check:
    runs-on: ubuntu-latest
    needs: [build, security, e2e]
    if: always()

    steps:
    - name: Check build status
      run: |
        if [ "${{ needs.build.result }}" = "failure" ]; then
          echo "❌ Build failed"
          exit 1
        fi
        echo "✅ Build passed"

    - name: Check security status
      run: |
        if [ "${{ needs.security.result }}" = "failure" ]; then
          echo "⚠️ Security scan failed (non-blocking)"
        else
          echo "✅ Security scan passed"
        fi

    - name: Check E2E status
      run: |
        if [ "${{ needs.e2e.result }}" = "failure" ]; then
          echo "⚠️ E2E tests failed (non-blocking)"
        else
          echo "✅ E2E tests passed"
        fi

  # Deploy to production (only on main branch, after all tests pass)
  deploy:
    runs-on: ubuntu-latest
    needs: [build, security, e2e]
    if: github.ref == 'refs/heads/main' && needs.build.result == 'success'

    steps:
    - uses: actions/checkout@v4

    # Deploy Backend to Railway
    - name: Deploy Backend to Railway
      run: |
        curl -X POST https://api.railway.app/graphql \
          -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
          -H "Content-Type: application/json" \
          -d '{
            "query": "mutation { environmentTriggerDeploy(input: {environmentId: \"prod\"}) { id } }"
          }' || echo "⚠️ Railway deployment skipped (no token)"
      continue-on-error: true

    # Deploy Frontend to Vercel
    - name: Deploy Frontend to Vercel
      run: |
        if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
          echo "⚠️ Vercel deployment skipped (no token)"
        else
          npm install -g vercel
          cd arari-app
          vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        fi
      continue-on-error: true

    # Notify deployment status
    - name: Deployment Complete
      run: |
        echo "✅ Deployment pipeline completed"
        echo "Backend: Railway (arari-prov20-production)"
        echo "Frontend: Vercel (arari-pr-ov2-0)"
