name: Arari PRO CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Cache Python dependencies
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('arari-app/api/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    # Cache npm dependencies
    - name: Cache npm dependencies
      uses: actions/cache@v4
      with:
        path: arari-app/node_modules
        key: ${{ runner.os }}-npm-${{ hashFiles('arari-app/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r arari-app/api/requirements.txt
        pip install pytest-cov

    - name: Install Node.js dependencies
      run: |
        cd arari-app
        npm install

    # Run Python tests with coverage
    - name: Run Python tests with coverage
      run: |
        cd arari-app/api
        python -m pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing

    # Run Frontend tests
    - name: Run Frontend tests
      run: |
        cd arari-app
        npm test

    # Python linter
    - name: Run Python linter
      run: |
        cd arari-app
        python -m ruff check api

    # Frontend linter
    - name: Run Frontend linter
      run: |
        cd arari-app
        npm run lint

    # Build verification - ensure production build works
    - name: Build Frontend (Production)
      run: |
        cd arari-app
        npm run build

  security:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install security tools
      run: |
        pip install safety bandit

    # Scan Python dependencies for vulnerabilities
    - name: Check Python dependencies (Safety)
      run: |
        pip install -r arari-app/api/requirements.txt
        safety check --json --output safety-report.json || true
      continue-on-error: true

    # Static Analysis Security Testing (Python)
    - name: SAST Python (Bandit)
      run: |
        bandit -r arari-app/api -f json -o bandit-report.json -ll || true
      continue-on-error: true

    # Scan Node dependencies for vulnerabilities
    - name: Check Node dependencies (npm audit)
      run: |
        cd arari-app
        npm audit --audit-level=moderate --json > npm-audit.json || true
      continue-on-error: true

    # Upload security reports as artifacts
    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          safety-report.json
          bandit-report.json
          arari-app/npm-audit.json
        retention-days: 30
