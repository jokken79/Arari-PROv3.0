name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Sundays at midnight
    - cron: '0 0 * * 0'

jobs:
  python-security:
    name: Python Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: arari-app/api/requirements.txt

      - name: Install dependencies
        run: |
          cd arari-app/api
          pip install -r requirements.txt
          pip install safety bandit

      - name: Run Safety (dependency vulnerability check)
        continue-on-error: true
        run: |
          cd arari-app/api
          safety check --full-report -r requirements.txt 2>&1 | tee safety-report.txt

      - name: Run Bandit (SAST for Python)
        continue-on-error: true
        run: |
          cd arari-app/api
          bandit -r . -f json -o bandit-report.json --exclude ./tests || true
          bandit -r . -f txt --exclude ./tests 2>&1 | tee bandit-report.txt

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: python-security-reports
          path: |
            arari-app/api/safety-report.txt
            arari-app/api/bandit-report.json
            arari-app/api/bandit-report.txt
          retention-days: 30

  node-security:
    name: Node.js Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: arari-app/package-lock.json

      - name: Install dependencies
        run: |
          cd arari-app
          npm ci

      - name: Run npm audit
        continue-on-error: true
        run: |
          cd arari-app
          npm audit --json > npm-audit-report.json 2>&1 || true
          npm audit 2>&1 | tee npm-audit-report.txt

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: node-security-reports
          path: |
            arari-app/npm-audit-report.json
            arari-app/npm-audit-report.txt
          retention-days: 30

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript', 'python']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: +security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for common secret patterns
        run: |
          echo "Checking for potential secrets..."
          # Check for hardcoded passwords (excluding test files and env examples)
          grep -r "password\s*=\s*['\"]" --include="*.py" --include="*.ts" --include="*.tsx" \
            --exclude-dir=tests --exclude-dir=node_modules --exclude="*.test.*" \
            arari-app/ || echo "No hardcoded passwords found"

          # Check for API keys patterns
          grep -rE "(api[_-]?key|apikey)\s*[:=]\s*['\"][^'\"]+['\"]" \
            --include="*.py" --include="*.ts" --include="*.tsx" \
            --exclude-dir=tests --exclude-dir=node_modules \
            arari-app/ || echo "No API key patterns found"

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [python-security, node-security]
    if: always()

    steps:
      - name: Download all security reports
        uses: actions/download-artifact@v4
        with:
          path: security-reports

      - name: Generate Summary
        run: |
          echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Python Security (Safety + Bandit)" >> $GITHUB_STEP_SUMMARY
          echo "- Safety: Dependency vulnerability check" >> $GITHUB_STEP_SUMMARY
          echo "- Bandit: Static Application Security Testing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Node.js Security (npm audit)" >> $GITHUB_STEP_SUMMARY
          echo "- Checked package dependencies for known vulnerabilities" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📁 Detailed reports available in workflow artifacts" >> $GITHUB_STEP_SUMMARY
