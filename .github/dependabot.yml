version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/arari-app/api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 5
    reviewers:
      - "jokken79"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps(python):"
      include: "scope"

  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/arari-app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 5
    reviewers:
      - "jokken79"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps(npm):"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "03:00"
    open-pull-requests-limit: 5
    reviewers:
      - "jokken79"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps(actions):"
